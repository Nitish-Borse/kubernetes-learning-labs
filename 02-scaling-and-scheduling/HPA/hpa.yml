apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: apache-hpa
  namespace: apache-ns
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: apache-dep
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50

# To forward the Apache service port:
# kubectl port-forward service/apache-service 8080:80 -n apache-ns --address=0.0.0.0 &

# To create a temporary pod for generating CPU load:
# kubectl run -i --tty loadbalancing --image=busybox:latest -n apache-ns /bin/sh

# After entering the pod, generate load:
# while true; do wget -q -O- http://apache-service.apache-ns.svc.cluster.local; done
#
# Watch HPA:
# kubectl get hpa -n apache-ns -w
#
# Watch pods:
# kubectl get pods -n apache-ns -w
