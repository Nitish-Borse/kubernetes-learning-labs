apiVersion: apps/v1
kind: Deployment
metadata:
  name: startup-demo
spec:
  replicas: 1

  selector:
    matchLabels:
      app: startup-demo

  template:
    metadata:
      labels:
        app: startup-demo

    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80

          startupProbe:
            httpGet:
              path: /
              port: 80

            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /
              port: 80

            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
