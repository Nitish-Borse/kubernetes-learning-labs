apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe-settings-demo
spec:
  replicas: 1

  selector:
    matchLabels:
      app: probe-settings-demo

  template:
    metadata:
      labels:
        app: probe-settings-demo

    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80

          livenessProbe:
            httpGet:
              path: /
              port: 80

            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
