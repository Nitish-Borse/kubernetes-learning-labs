apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-dep
  namespace: notes-ns
  labels:
    app: mysql

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mysql

  template:
    metadata:
      labels:
        app: mysql

    spec:
      # Run MySQL on the t3.small master node
      nodeSelector:
        mysql: "true"

      # Allow the pod to run on the control-plane node
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"

      containers:
        - name: mysql
          image: mysql:8.0

          ports:
            - containerPort: 3306

          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notes-db-secret
                  key: DB_PASSWORD

            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: notes-db-secret
                  key: DB_NAME

          # Reduce MySQL memory usage for the small EC2 learning cluster
          args:
            - --performance_schema=OFF
            - --innodb-buffer-pool-size=128M
            - --max_connections=50

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"

            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          resources:
            requests:
              cpu: 100m
              memory: 256Mi

            limits:
              cpu: 500m
              memory: 512Mi
