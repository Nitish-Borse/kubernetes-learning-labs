apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: devopslabs.learning.nitish.dev

spec:
  group: learning.nitish.dev

  names:
    plural: devopslabs
    singular: devopslab
    kind: DevOpsLab
    shortNames:
      - lab
      - labs

  scope: Namespaced

  versions:
    - name: v1
      served: true
      storage: true

      schema:
        openAPIV3Schema:
          type: object

          properties:
            spec:
              type: object

              properties:
                topic:
                  type: string
                  description: "Topic being practiced"

                duration:
                  type: string
                  description: "Duration of the learning activity"

                mode:
                  type: string
                  description: "Learning mode"

                platform:
                  type: string
                  description: "Learning platform"
